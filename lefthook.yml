# Lefthook (git hooks).
#
# The gate lives on *push*, not per commit: CI does not run on a draft PR
# (AGENTS.md → CI cost and the draft convention), so the local static pass is the
# only signal a draft gets before it is marked ready.
#
# It is deliberately skippable — there are legitimate reasons to push red mid-flow,
# and the point of the hook is that skipping is a *choice* (git push --no-verify,
# or LEFTHOOK=0), not something you do by forgetting.
pre-push:
  commands:
    # Runs first so a missing run marker is the first thing you read. Advisory
    # only — it exits 0 either way. CI's `ship` job is the gate that holds.
    ship-marker:
      priority: 1
      run: scripts/dev/ship-nag.sh push
    lint:
      run: gofmt -l . | (! grep .) && go vet ./... && golangci-lint run && go test -race ./...
      fail_text: |
        The Go pre-pass is red — gofmt/vet/golangci-lint/tests must pass before a
        push, because CI skips every job on a draft PR. Fix the reported issues, or
        push with --no-verify if you deliberately want a red draft. See
        docs/agentic-review.md §1.1.
